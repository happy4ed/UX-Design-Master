name: Validate skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: python3 -m pip install Pillow playwright
      - name: Install browser for rendered report verification
        run: python3 -m playwright install chromium
      - name: Standalone package and contract regressions
        run: |
          python3 scripts/check_release_package.py
          python3 tests/test_color_variations.py
          python3 tests/test_design_system_checker.py
          python3 tests/test_infographic_contract.py
          python3 tests/test_motion_authoring_recipes.py
          python3 tests/test_motion_cluster_audit.py
          python3 tests/test_motion_component_graph.py
          python3 tests/test_motion_concept_index.py
          python3 tests/test_motion_core_progress.py
          python3 tests/test_presentation_contract.py
          python3 tests/test_theme_exploration.py
          python3 tests/test_user_input_obligations.py
          python3 tests/test_measurement_contract.py
          python3 tests/test_app_review_report.py
          python3 tests/test_app_review_report_browser.py
          python3 tests/test_functional_inventory.py
          python3 tests/test_wireframe_variants.py
          python3 tests/test_runtime_content_audit.py
          node tests/test_capture_design_evidence.mjs
          node tests/test_screen_title_copy.mjs
          node tests/test_text_layout_binary_search.mjs
          node tests/test_motion_vocabulary.mjs
