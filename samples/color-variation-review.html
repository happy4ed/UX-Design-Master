<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스타일 구조군과 키 컬러 변주</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#192027;background:#f4f5f3}*{box-sizing:border-box}body{margin:0}header{padding:30px max(20px,calc((100vw - 1280px)/2));background:#18222a;color:white}h1{font-size:clamp(25px,3vw,38px);letter-spacing:-.04em;margin:0 0 10px}header p{max-width:800px;line-height:1.6;margin:0;color:#d6dedd}main{max-width:1280px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px}aside,.panel{background:#fff;border:1px solid #d9dfdf;border-radius:16px;padding:20px}aside{align-self:start;max-height:calc(100vh - 32px);overflow:auto;position:sticky;top:16px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:24px 0 12px}.hint{font-size:13px;color:#536069;line-height:1.5}.family{border-top:1px solid #e1e6e6;padding:12px 0}.family button,.site button{border:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer;padding:4px 0}.family button:hover,.site button:hover{text-decoration:underline}.family small{display:block;color:#5d6b70;line-height:1.4}.family .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.family .chips span{width:22px;height:22px;border:1px solid #b7c1c1;border-radius:50%}.site{display:inline-block;margin:4px 8px 0 0}.site button[aria-current="true"]{font-weight:800;text-decoration:underline}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.legend span{font-size:12px;background:#edf1f1;padding:5px 8px;border-radius:8px}.seed{display:flex;align-items:center;gap:16px;padding:16px;background:#f6f8f7;border-radius:12px}.seed .swatch{width:70px;height:70px;border-radius:12px;border:1px solid #aab4b4;flex:none}.seed strong{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.tile{border:1px solid #d9dfdf;border-radius:12px;overflow:hidden}.tile .color{height:72px}.tile .meta{padding:10px;font-size:12px;line-height:1.5;min-height:83px}.tile b{display:block;font-size:13px}.gradient-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.gradient{border:1px solid #d9dfdf;border-radius:12px;overflow:hidden}.gradient .paint{height:110px;display:flex;align-items:center;justify-content:center;font-weight:700}.gradient .meta{padding:12px;font-size:12px;line-height:1.5}.gradient code{display:block;white-space:normal;overflow-wrap:anywhere;margin-top:6px}.warning{color:#a0441b}.good{color:#176145}.divider{height:1px;background:#e1e6e6;margin:18px 0}@media(max-width:760px){main{display:block;padding:14px}aside{position:static;max-height:none;margin-bottom:14px}header{padding:24px 16px}.panel{padding:16px}}
</style>
</head>
<body>
<header><h1>스타일 구조군과 키 컬러 변주</h1><p>30개 사이트를 구조가 비슷한 사례끼리 묶어 보고, 키 컬러에서 유사색·보색·같은 지각 명도·채도·톤 변주를 비교합니다. 사이트 키 컬러는 내부 시연용 투영값이며 공식 브랜드 색이 아닙니다.</p></header>
<main><aside><h2>구조군 <span id="family-count"></span></h2><p class="hint">한 홈페이지 표본의 표면, 정렬, 간격, 글꼴 분류를 비교한 탐색용 군입니다. 군 안의 사이트도 실제 색과 세부 디자인은 다릅니다.</p><div id="families"></div></aside><section class="panel" aria-live="polite"><h2 id="title">사이트 선택</h2><p class="hint" id="source"></p><div id="members"></div><div class="divider"></div><div id="detail"></div></section></main>
<script>
const catalog='../knowledge/';let families=[],sets=new Map(),selected='';
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function familyFor(site){return families.find(f=>f.members.includes(site))}
function selectSite(site){selected=site;const family=familyFor(site),set=sets.get('site:'+site);if(!set)return;$('title').textContent=site+' · '+family.id;$('source').textContent=`구조군 대표 ${family.representative} · 군의 구조 유사도 최소 ${family.pairwiseMinimum} · 색상 근거: ${set.sourceEvidence}`;$('members').innerHTML=family.members.map(m=>`<span class="site"><button type="button" data-site="${esc(m)}" aria-current="${m===site}">${esc(m)}</button></span>`).join('');
const rows=set.variants.map(v=>`<div class="tile"><div class="color" style="background:${v.hex}"></div><div class="meta"><b>${esc(v.id)}</b>${v.hex} · 대비 ${v.contrastOnBackground}:1<br>OKLCH L ${v.oklch.L}${v.mapping.gamutReduced?' · 색역 맞춤':''}</div></div>`).join('');
const gradients=set.gradients.map(g=>`<div class="gradient"><div class="paint" style="background:${g.css};color:${g.foreground.color||'#111'}">${esc(g.id)}</div><div class="meta">${esc(g.purpose)}<br><span class="${g.foreground.textSafe?'good':'warning'}">${g.foreground.textSafe?'검정/흰색 본문 대비 후보':'본문 대비 부족'} · 최저 ${g.foreground.minimumContrast}:1</span><code>${esc(g.css)}</code></div></div>`).join('');
$('detail').innerHTML=`<div class="seed"><div class="swatch" style="background:${set.seed}"></div><div><strong>${set.seed}</strong><div class="hint">시드 · OKLCH ${set.seedOklch.L} / ${set.seedOklch.C} / ${set.seedOklch.h}°</div></div></div><p class="hint">이 구조군에서 관찰한 CSS 그라데이션 형태: ${Object.keys(family.observedGradientMotifs).length?Object.entries(family.observedGradientMotifs).map(([name,count])=>`${esc(name)} ${count}`).join(' · '):'현재 표본에 기록 없음'}</p><div class="legend"><span>유사색 ±30°</span><span>보색 180°</span><span>동일 지각 명도</span><span>채도/톤</span><span>대비는 별도 검사</span></div><h3>색상 후보</h3><div class="grid">${rows}</div><h3>그라데이션 후보</h3><div class="gradient-grid">${gradients}</div><p class="hint">그라데이션 대비는 샘플 지점의 검정·흰색 일반 본문 기준입니다. 실제 문구 위치와 브라우저 렌더에서 다시 확인하세요.</p>`;
document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>selectSite(b.dataset.site));}
async function init(){try{const [fa,va]=await Promise.all(['style-families.json','color-variations.json'].map(name=>fetch(catalog+name).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})));families=fa.families;sets=new Map(va.sets.map(v=>[v.id,v]));$('family-count').textContent=`${families.length}개 / 30개 사이트`;$('families').innerHTML=families.map(f=>`<div class="family"><button type="button" data-family="${esc(f.id)}"><b>${esc(f.representative)}</b> <span class="hint">${f.members.length}개 사이트</span></button><small>${f.members.map(esc).join(' · ')}</small><div class="chips" aria-label="시연용 키 컬러">${Object.values(f.distinctKeyColors).map(c=>`<span style="background:${c}" title="${c}"></span>`).join('')}</div></div>`).join('');document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>selectSite(families.find(f=>f.id===b.dataset.family).representative));selectSite(families[0].representative)}catch(err){$('detail').textContent='데이터를 읽지 못했습니다. 로컬 HTTP 서버에서 이 파일을 여세요. '+err.message}}
init();
</script>
</body></html>
