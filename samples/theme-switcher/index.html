<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>색 테마 축 미리보기</title><style>
:root{font-family:system-ui,sans-serif;color:#192537;background:#eef2f7}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:28px 18px 60px}h1{font-size:clamp(25px,3vw,36px);letter-spacing:-.04em;margin:0 0 8px}p{line-height:1.55;color:#526377;max-width:70ch}.controls{display:flex;flex-wrap:wrap;gap:16px;margin:25px 0}.group{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.group strong{font-size:13px;margin-right:7px}.group button{border:1px solid #b9c6d5;background:#fff;color:#293b53;border-radius:8px;padding:9px 11px;min-height:44px;font:inherit;cursor:pointer}.group button[aria-pressed=true]{background:#233953;color:white;border-color:#233953}.preview{display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap}.phone{width:414px;max-width:100%;border:10px solid #243549;border-radius:35px;background:#243549;padding:7px;box-shadow:0 20px 50px #18365338}.phone iframe{display:block;width:100%;height:720px;border:0;border-radius:20px;background:white}.meta{flex:1;min-width:220px}.meta a{display:inline-block;color:#075fac;font-weight:700;margin:12px 0}.meta code{overflow-wrap:anywhere}.meta pre{padding:14px;background:white;border:1px solid #d5e0eb;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,a:focus-visible{outline:3px solid #168bfa;outline-offset:2px}
</style></head><body><main><h1>색 테마를 같은 화면에서 비교</h1><p>구성·컴포넌트·데이터를 고정하고 색만 바꿉니다. 아래 화면은 사용법을 보여 주는 내부 예시입니다. 실제 프로젝트에서는 승인된 대표 화면과 토큰을 연결해 같은 방식으로 확인합니다.</p><div class="controls" id="controls"><div class="group" data-group="pal"><strong>키 컬러</strong><button type="button" data-value="0">청색</button><button type="button" data-value="1">청록</button><button type="button" data-value="2">보라</button><button type="button" data-value="3">산호</button><button type="button" data-value="4">올리브</button></div><div class="group" data-group="view"><strong>화면</strong><button type="button" data-value="list">목록</button><button type="button" data-value="review">검토</button></div><div class="group" data-group="scheme"><strong>모드</strong><button type="button" data-value="light">라이트</button><button type="button" data-value="dark">다크</button></div></div><div class="preview"><div class="phone"><iframe id="screen" title="선택한 테마의 휴대폰 화면"></iframe></div><div class="meta"><h2>선택한 축</h2><p>화면·색·모드를 각각 바꿉니다. 각 색의 강조·완료·주의·오류 대비와 데이터 부호는 프로젝트의 의미 색 표로 따로 검증해야 합니다.</p><a id="desktop" target="_blank" rel="noopener" href="sample-screen.html">PC 크기로 열기 ↗</a><pre id="selection"></pre></div></div></main><script>
const state={pal:'0',view:'list',scheme:'light'};const controls=document.querySelector('#controls');function render(){for(const group of controls.querySelectorAll('[data-group]'))for(const button of group.querySelectorAll('button'))button.setAttribute('aria-pressed',String(state[group.dataset.group]===button.dataset.value));const url=new URL('sample-screen.html',location.href);for(const [key,value] of Object.entries(state))url.searchParams.set(key,value);document.querySelector('#screen').src=url.href;document.querySelector('#desktop').href=url.href;document.querySelector('#selection').textContent=`구성: 고정 예시\n색 후보: ${Number(state.pal)+1}/5\n화면: ${state.view}\n모드: ${state.scheme}`};controls.addEventListener('click',event=>{const button=event.target.closest('button[data-value]');if(!button)return;state[button.closest('[data-group]').dataset.group]=button.dataset.value;render()});render();
</script></body></html>
