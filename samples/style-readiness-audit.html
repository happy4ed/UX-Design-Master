<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타일별 명세 완성도</title><style>
:root{font-family:Arial,"Noto Sans KR",sans-serif;background:#f4f3ee;color:#151515;scrollbar-gutter:stable}*{box-sizing:border-box}body{margin:0}main{max-width:1300px;padding:clamp(16px,3vw,42px);margin:auto}h1{font-size:clamp(34px,5vw,64px);letter-spacing:-.06em;line-height:1;margin:18px 0}.lead{max-width:850px;line-height:1.5}.note{border-left:6px solid #00a4a7;background:#fff;padding:14px 18px;line-height:1.5;margin:20px 0}.table{overflow:auto;border:2px solid #151515;background:#fff}table{width:100%;min-width:980px;border-collapse:collapse}th,td{border-bottom:1px solid #bbb;padding:12px;text-align:left;vertical-align:top;font-size:14px;overflow-wrap:anywhere}th{background:#fdd901;position:sticky;top:0}a{color:#111;text-underline-offset:3px}.badge{font-weight:800}.no{color:#8f1739}.yes{color:#006d5d}input{font:inherit;min-height:48px;border:2px solid #111;padding:8px 12px;width:min(350px,100%);margin:15px 0}@media(max-width:600px){main{padding:16px}}
</style></head><body><main><h1>스타일 명세<br>완성도</h1><p class="lead">A~L 문서 구조, 작동하는 <code>guess</code> 레퍼런스, 과업별 실제 검증을 구분합니다. 원본 충실도와 사용성은 별도 실측이 필요합니다.</p><div class="note"><b>현재 판정</b><br>26개 모두 A~L 가이드와 13개 부품·5개 모션의 작동하는 <code>guess</code> 기본 레퍼런스를 갖췄습니다. 원본 사실로 승격하거나 특정 제품의 모든 기능에 적용하는 작업은 별도 검증이 필요합니다. 네오 부르탈리즘 N6에는 앱·웹·문서의 같은 과업 시연도 있습니다.</div><label>스타일 검색 <input id="search" type="search" placeholder="이름 검색"></label><p id="count" aria-live="polite">읽는 중</p><div class="table"><table><thead><tr><th>스타일</th><th>A~L 가이드</th><th>컴포넌트 명세</th><th>모션 명세</th><th>앱·웹·문서 예시</th><th>채택 상태</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const ids='aurora-mesh bauhaus-swiss bento-grid claymorphism dark-cinematic dark-tech editorial-print flat-2 frutiger-aero glassmorphism grainy-gradient ios-27 kinetic-typography material-3-expressive maximalism memphis minimalism neo-brutalism neumorphism oneui-9 origami-paper retro-pixel scroll-3d skeuo-audio-hifi swiss-grid y2k-chrome'.split(' ');const headings='ABCDEFGHIJKL'.split('');let all=[];function render(){const q=document.getElementById('search').value.toLowerCase();const shown=all.filter(x=>x.id.includes(q));document.getElementById('count').textContent=`${shown.length} / ${all.length}개`;document.getElementById('rows').innerHTML=shown.map(x=>{const id=encodeURIComponent(x.id),neo=x.id==='neo-brutalism';const guide=x.sections===12?'<span class="yes">12/12 절</span>':`<span class="no">${x.sections}/12 절</span>`;return `<tr><td><b>${x.id}</b><br><a href="style-guidebook.html?style=${id}">가이드 열기</a></td><td>${guide}<br>내용 품질 별도 검증</td><td><a href="style-guess-books.html?style=${id}#components">13개 guess 부품과 작동 보드</a>${neo?' · <a href="neo-brutalism-component-motion-book.html#components">N6 과업 계약</a>':''}</td><td><a href="style-guess-books.html?style=${id}#motion-demo">5개 guess 장면 재생</a></td><td>${neo?'<a href="neo-brutalism-cross-media.html">세 매체 시연</a>':'세 매체 동일 과업 검증은 별도'}</td><td class="badge">기본 guess 레퍼런스 · 사용자 확인 전</td></tr>`}).join('')};Promise.all(ids.map(async id=>{try{const t=await fetch('../references/style-book/'+id+'.md').then(r=>r.text());const found=new Set([...t.matchAll(/^#{2,3}\s+([A-L])(?:\.|\s)/gm)].map(m=>m[1]));return{id,sections:headings.filter(h=>found.has(h)).length}}catch{return{id,sections:0}}})).then(x=>{all=x;render()});document.getElementById('search').addEventListener('input',render);
</script></body></html>
