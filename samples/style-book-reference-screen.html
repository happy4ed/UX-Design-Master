<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타일 가이드 기준 화면</title>
<link rel="stylesheet" href="style-book-core.css">
<link rel="stylesheet" href="style-book-detail-layer.css"><link rel="stylesheet" href="style-book-ios-liquid.css"><link rel="stylesheet" href="style-book-additional-tokens.css"><link rel="stylesheet" href="style-book-additional-effects.css"></head><body><svg class="ios-filter-defs" aria-hidden="true" width="0" height="0"><defs><filter id="ios-liquid-refraction" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".006 .011" numOctaves="1" seed="7" result="noise"/><feGaussianBlur in="noise" stdDeviation="5" result="wave"/><feDisplacementMap in="SourceGraphic" in2="wave" scale="24" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg><header class="top"><div><h1>스타일 기준 화면</h1><p>같은 기능·문구에 적용한 내부 비교안 · 플랫폼 원본 화면/자유 스타일 실측 복제 아님 · <a href="style-guidebook.html">상세 가이드북</a></p></div><div class="toolbar"><select id="styleFilter" aria-label="스타일 선택" style="min-height:48px;border:1px solid #b8bac4;border-radius:9px;padding:0 12px;font:inherit"><option value="all">전체 스타일</option></select><button id="scheme" type="button" aria-pressed="false">라이트 보기</button><button id="layout" type="button" aria-pressed="false">폴드 보기</button></div></header><main class="grid" id="grid"></main>
<script src="../references/style-book/detail-decisions.js"></script><script>
const variants=[["oneui","One UI 9","전달 실측+캐논 · 미확인 부품은 가안"],["material","Material 3 Expressive","Compose 토큰을 기준으로 한 가안"],["ios","iOS 27","키트 전달값+공식 HIG · 미확인 상태는 가안"],["hifi","오디오 하이파이","실물 구조 관찰+디지털 제안"],["glassmorphism","글래스모피즘","자유 스타일 · guess 가안"],["neumorphism","뉴모피즘","자유 스타일 · guess 가안"],["claymorphism","클레이모피즘","자유 스타일 · guess 가안"],["flat-2","플랫 2.0","자유 스타일 · guess 가안"],["neo-brutalism","네오브루탈리즘","자유 스타일 · guess 가안"],["bauhaus-swiss","바우하우스·스위스","자유 스타일 · guess 가안"],["memphis","멤피스","자유 스타일 · guess 가안"],["y2k-chrome","Y2K 크롬","자유 스타일 · guess 가안"],["maximalism","맥시멀리즘","자유 스타일 · guess 가안"],["editorial-print","에디토리얼","자유 스타일 · guess 가안"],["minimalism","미니멀리즘","자유 스타일 · guess 가안"],["dark-cinematic","시네마틱 다크","자유 스타일 · guess 가안"],["aurora-mesh","오로라 메쉬","자유 스타일 · guess 가안"],["frutiger-aero","프루티거 에어로","자유 스타일 · guess 가안"],["origami-paper","오리가미 종이","자유 스타일 · guess 가안"],["bento-grid","벤토 그리드","자유 스타일 · guess 가안"],["dark-tech","다크 테크","자유 스타일 · guess 가안"],["kinetic-typography","키네틱 타이포","자유 스타일 · guess 가안"],["scroll-3d","스크롤 3D","자유 스타일 · guess 가안"],["grainy-gradient","그레이니 그라데이션","자유 스타일 · guess 가안"],["retro-pixel","레트로 픽셀","자유 스타일 · guess 가안"],["swiss-grid","스위스 스타일","자유 스타일 · guess 가안"]];
const screen=(id,label,note)=>`<section class="sample"><h2 class="caption">${label}</h2><p class="sub">${note}</p><div class="phone ${id}" data-style="${id}"><div class="inner"><div class="appbar"><strong>거실 리모컨</strong><button class="icon-btn" aria-label="설정" type="button">⚙</button></div><input class="search" placeholder="영화나 음악 찾기" aria-label="검색"><div class="chips"><button type="button" class="chip" aria-pressed="true">전체</button><button type="button" class="chip" aria-pressed="false">즐겨찾기</button></div><div class="poster" role="img" aria-label="황혼의 산과 도시를 묘사한 예시 포스터">${id==='ios'?'<div class="ios-liquid-lens ios-poster-lens"><span class="ios-lens-label">지금 재생 중</span><span class="ios-lens-mark" aria-hidden="true">◉</span></div>':''}<div class="poster-label"><strong>밤의 풍경</strong><span>지금 재생 중</span></div></div><div class="media"><h2>오래된 도시</h2><p class="artist">여름의 산책 · 2:34</p><input class="scrub" type="range" value="42" aria-label="재생 위치"><div class="times"><span>1:04</span><span>2:34</span></div><div class="transport"><button type="button" class="skip" aria-label="이전 곡">◀◀</button><button type="button" class="play" aria-label="일시정지">Ⅱ</button><button type="button" class="skip" aria-label="다음 곡">▶▶</button></div><div class="volume"><label>음량</label><div class="volume-row"><button type="button" aria-label="음량 줄이기">−</button><input type="range" value="65" aria-label="음량 조절"><button type="button" aria-label="음량 높이기">+</button></div></div></div><div class="section">연결</div><div class="row"><span>거실 스피커</span><small>연결됨</small></div><div class="row"><span>재생 목록</span><small>12곡 ›</small></div></div></div><p class="evidence">${note}. 수치·동작은 개별 A–L 가이드와 실측 결과를 함께 확인.</p></section>`;
const selected=new URLSearchParams(location.search).get('style')||'all';
const boardLink=document.createElement('a');boardLink.href='style-book-component-board.html'+(selected==='all'?'':'?style='+encodeURIComponent((Object.entries(window.STYLE_DETAILS).find(([,d])=>d.preview===selected)||[])[0]||'oneui-9'));boardLink.textContent='컴포넌트 시연';document.querySelector('.top p').append(' · ',boardLink);
const filter=document.querySelector('#styleFilter');
filter.innerHTML+=[...variants].map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
filter.value=variants.some(v=>v[0]===selected)?selected:'all';
filter.onchange=()=>{const url=new URL(location.href);if(filter.value==='all')url.searchParams.delete('style');else url.searchParams.set('style',filter.value);location.href=url.href};
document.querySelector('#grid').innerHTML=variants.filter(v=>filter.value==='all'||v[0]===filter.value).map(x=>screen(...x)).join('');
const details=Object.values(window.STYLE_DETAILS||{});
function iconSvg(kind,form){const fill=['filled','angular','geometric','technical'].includes(form),stroke=fill?'none':'currentColor',cap=['angular','geometric','technical'].includes(form)?'square':'round';let shape='';if(kind==='gear')shape=fill?'<path d="M12 2.5 14 4l2.6-.5.7 2.6 2.2 1.3-1 2.4 1 2.2-2.2 1.2-.7 2.7-2.6-.5-2 1.6-2-1.6-2.6.5-.7-2.7-2.2-1.2 1-2.2-1-2.4 2.2-1.3.7-2.6L10 4z"/><circle cx="12" cy="10" r="2.4" fill="var(--ctrl)"/>':'<path d="M9.5 3.5 10.5 2h3l1 1.5 2 1 1.7-.2 1.5 2.6-.8 1.5v2.2l.8 1.5-1.5 2.6-1.7-.2-2 1-1 1.5h-3l-1-1.5-2-1-1.7.2-1.5-2.6.8-1.5V8.4l-.8-1.5 1.5-2.6 1.7.2z"/><circle cx="12" cy="10" r="2.2"/>';else if(kind==='previous')shape=fill?'<path d="M5 4h2v12H5zM18 4 8 10l10 6z"/>':'<path d="M6 4v12M17 4 8 10l9 6z"/>';else if(kind==='next')shape=fill?'<path d="M17 4h2v12h-2zM6 4l10 6-10 6z"/>':'<path d="M18 4v12M7 4l9 6-9 6z"/>';else if(kind==='pause')shape=fill?'<path d="M6 4h4v12H6zM14 4h4v12h-4z"/>':'<path d="M8 4v12M16 4v12"/>';else shape=fill?'<path d="M7 3 18 10 7 17z"/>':'<path d="M7 3 18 10 7 17z"/>';return `<svg viewBox="0 0 24 20" aria-hidden="true" fill="${fill?'currentColor':'none'}" stroke="${stroke}" stroke-linecap="${cap}" stroke-linejoin="round">${shape}</svg>`}
document.querySelectorAll('.phone').forEach(phone=>{const spec=details.find(d=>d.preview===phone.dataset.style),form=spec?.iconForm||'round';phone.dataset.iconForm=form;phone.querySelector('.icon-btn').innerHTML=iconSvg('gear',form);phone.querySelector('.skip:first-child').innerHTML=iconSvg('previous',form);phone.querySelector('.skip:last-child').innerHTML=iconSvg('next',form);phone.querySelector('.play').innerHTML=iconSvg('pause',form);phone.querySelectorAll('input[type=range]').forEach(input=>{input.style.setProperty('--value',input.value+'%');input.addEventListener('input',()=>input.style.setProperty('--value',input.value+'%'))})});
document.querySelector('#scheme').onclick=e=>{let on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'다크 보기':'라이트 보기';document.body.classList.toggle('light',on)};
document.querySelector('#layout').onclick=e=>{let on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'폰 보기':'폴드 보기';document.body.classList.toggle('fold',on)};
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{const row=b.parentElement;row.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}));
document.querySelectorAll('.play').forEach(b=>b.addEventListener('click',()=>{let paused=b.getAttribute('aria-label')==='일시정지';b.setAttribute('aria-label',paused?'재생':'일시정지');b.innerHTML=iconSvg(paused?'play':'pause',b.closest('.phone').dataset.iconForm)}));
</script></body></html>
