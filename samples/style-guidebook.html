<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UX Design Master · 스타일 가이드북</title>
<style>
.group-label,.source pre{font-size:13px!important}
:root{font-family:system-ui,"Noto Sans KR",sans-serif;color:#24252a;background:#f3f2ef;scrollbar-gutter:stable}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#165a9d}.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid #d8d8d4;padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.side h1{font-size:20px;line-height:1.2;margin:0 0 6px}.muted{color:#626670;font-size:14px;line-height:1.5}.side input,.controls select{width:100%;min-height:46px;border:1px solid #a8abb0;border-radius:8px;background:#fff;padding:0 12px;color:#24252a}.side input{margin:16px 0}.group-label{font-size:12px;letter-spacing:.08em;color:#72747a;margin:20px 0 7px;font-weight:700}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;min-height:44px;padding:9px 10px;color:#282a30}.nav button[aria-current=true]{background:#e6ecf4;color:#143d6a;font-weight:700}.nav small{display:block;color:#71737a;font-weight:400;margin-top:2px}.main{min-width:0;padding:28px clamp(16px,3vw,48px) 70px}.head{display:flex;align-items:start;justify-content:space-between;gap:20px;flex-wrap:wrap}.head h2{font-size:28px;line-height:1.2;margin:0 0 9px}.head p{max-width:760px;margin:0}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid #aeb5be;border-radius:7px;background:#fff;text-decoration:none;font-size:14px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stat{padding:8px 12px;background:#fff;border:1px solid #d7d7d3;border-radius:7px;font-size:13px}.stat.warn{background:#fff3dd;border-color:#e1bc70}.contract{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 24px}.contract article{background:#fff;border:1px solid #d8d8d4;border-radius:8px;padding:14px;min-width:0}.contract h3{font-size:13px;color:#5a5e65;margin:0 0 6px}.contract p{font-size:14px;line-height:1.5;margin:0;overflow-wrap:anywhere}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 12px}.controls label{font-size:14px;font-weight:600}.controls select{width:auto;min-width:200px}.tabs{display:flex;gap:5px;overflow-x:auto;padding:4px 0 12px}.tabs button{flex:none;min-width:44px;min-height:44px;border:1px solid #d1d3d6;border-radius:7px;background:#fff}.tabs button[aria-selected=true]{background:#263d5d;color:#fff;border-color:#263d5d}.panels{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}.panels.compare{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{min-width:0;background:#fff;border:1px solid #d8d8d4;border-radius:10px;padding:20px;overflow:hidden}.panel h3{margin:0 0 12px;font-size:18px}.md{line-height:1.6;font-size:14px;overflow-wrap:anywhere}.md p{margin:0 0 13px}.md ul,.md ol{padding-left:22px}.table-scroll{overflow-x:auto;max-width:100%;border:1px solid #dedfdf;border-radius:6px;margin:13px 0}.md table{border-collapse:collapse;width:100%;font-size:13px}.md th,.md td{min-width:95px;padding:9px 10px;vertical-align:top;border-bottom:1px solid #e2e2e0;overflow-wrap:anywhere}.md th{text-align:left;background:#f4f5f6;position:sticky;top:0}.md tr:last-child td{border-bottom:0}.md code{background:#f1f2f3;padding:1px 4px;border-radius:3px}.source{margin-top:12px}.source summary{cursor:pointer;font-size:13px;color:#4d5965}.source pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f5f5;padding:15px;font-size:12px;max-height:430px;overflow:auto}.empty{padding:25px;background:#fff;border:1px solid #ddd;border-radius:9px}.notice{background:#e9f1f9;border-left:4px solid #4376a8;padding:13px 16px;margin:18px 0;font-size:14px;line-height:1.5}.focusing{outline:3px solid #f4bb48;outline-offset:3px}@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid #ddd}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:2px}.main{padding-top:22px}.panels.compare{grid-template-columns:1fr}}@media(max-width:650px){.contract{grid-template-columns:1fr}.head h2{font-size:24px}.panel{padding:14px}.controls select{width:100%}}
</style></head><body><div class="shell"><aside class="side"><h1>스타일 가이드북</h1><p class="muted">26개 스타일의 원문 A–L 절과 빠진 근거를 함께 봅니다.</p><input id="search" type="search" placeholder="이름·내용 검색" aria-label="스타일 검색"><p><a href="modular-data-atlas-components.html">이미지 실험 후보 · 데이터 아틀라스</a></p><nav id="nav" class="nav" aria-label="스타일 목록"></nav></aside><main class="main"><header class="head"><div><h2 id="title">가이드 불러오는 중</h2><p id="intro" class="muted"></p></div><div class="links"><a id="preview" href="style-book-reference-screen.html">기준 화면 보기</a><a id="raw" href="#">Markdown 원문</a><a href="../references/style-book/README.md">목록 원문</a></div></header><div id="stats" class="stats"></div><div class="notice">플랫폼·실물 가이드의 미확인 값은 실제 스타일의 확정 사양이 아닙니다. 내부 시연 화면의 다른 모양도 원본 일치 증거가 아닙니다. 표에서 근거 등급과 L절의 검증 상태를 확인하세요.</div><div id="contract" class="contract"></div><div class="controls"><label for="compare">나란히 비교</label><select id="compare"><option value="">비교 안 함</option></select><span class="muted">A–L 탭을 눌러 같은 절을 비교할 수 있습니다.</span></div><div id="tabs" class="tabs" role="tablist" aria-label="가이드 절"></div><div id="panels" class="panels"></div></main></div>
<script>
const names=[["oneui-9","One UI 9","플랫폼"],["material-3-expressive","Material 3 Expressive","플랫폼"],["ios-27","iOS 27","플랫폼"],["skeuo-audio-hifi","오디오 하이파이","실물"],["glassmorphism","글래스모피즘","자유"],["neumorphism","뉴모피즘","자유"],["claymorphism","클레이모피즘","자유"],["flat-2","플랫 2.0","자유"],["neo-brutalism","네오브루탈리즘","자유"],["bauhaus-swiss","바우하우스·스위스","자유"],["memphis","멤피스","자유"],["y2k-chrome","Y2K 크롬","자유"],["maximalism","맥시멀리즘","자유"],["editorial-print","에디토리얼","자유"],["minimalism","미니멀리즘","자유"],["dark-cinematic","시네마틱 다크","자유"],["aurora-mesh","오로라 메쉬","자유"],["frutiger-aero","프루티거 에어로","자유"],["origami-paper","오리가미 종이","자유"],["bento-grid","벤토 그리드","자유"],["dark-tech","다크 테크","자유"],["kinetic-typography","키네틱 타이포","자유"],["scroll-3d","스크롤 3D","자유"],["grainy-gradient","그레이니 그라데이션","자유"],["retro-pixel","레트로 픽셀","자유"],["swiss-grid","스위스 스타일","자유"]];
const labels={A:'신원',B:'근거 목록',C:'기초 토큰',D:'기기·레이아웃',E:'컴포넌트',F:'패턴',G:'인터랙션',H:'문구',I:'허용·금지',J:'접근성',K:'미확인',L:'검증 렌더'};
const docs=new Map(), detailPromise=fetch('../references/style-book/detail-decisions.json').then(r=>r.json()), estimatePromise=fetch('../references/style-book/provisional-estimates.json').then(r=>r.json()), expressionPromise=fetch('../references/style-book/component-expression.json').then(r=>r.json());let current=new URLSearchParams(location.search).get('style')||'oneui-9',tab='A';if(!names.some(x=>x[0]===current))current='oneui-9';
const sourceNotice=document.createElement('div');sourceNotice.className='notice';document.querySelector('#contract').before(sourceNotice);
const boardLink=document.createElement('a');boardLink.textContent='컴포넌트 시연';document.querySelector('.links').append(boardLink);
const bookLink=document.createElement('a');bookLink.textContent='컴포넌트·모션 샘플';document.querySelector('.links').append(bookLink);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(raw,base){let s=esc(raw);s=s.replace(/`([^`]+)`/g,(_,t)=>'<code>'+t+'</code>');s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,u)=>{try{const url=new URL(u,base);return '<a href="'+esc(url.href)+'" target="_blank" rel="noopener">'+t+'</a>'}catch{return t}});return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function markdown(raw,base){let out=[],lines=raw.split('\n'),i=0;while(i<lines.length){let line=lines[i];if(!line.trim()){i++;continue}if(line.startsWith('|')){let block=[];while(i<lines.length&&lines[i].startsWith('|'))block.push(lines[i++]);let rows=block.filter(x=>!/^\|\s*:?-{2,}/.test(x));out.push('<div class="table-scroll"><table>'+rows.map((row,j)=>'<tr>'+row.slice(1,-1).split('|').map(cell=>'<'+(j?'td':'th')+'>'+inline(cell.trim(),base)+'</'+(j?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>');continue}if(/^[-*] /.test(line)){let li=[];while(i<lines.length&&/^[-*] /.test(lines[i]))li.push('<li>'+inline(lines[i++].slice(2),base)+'</li>');out.push('<ul>'+li.join('')+'</ul>');continue}if(/^\d+\. /.test(line)){let li=[];while(i<lines.length&&/^\d+\. /.test(lines[i]))li.push('<li>'+inline(lines[i++].replace(/^\d+\. /,''),base)+'</li>');out.push('<ol>'+li.join('')+'</ol>');continue}if(/^#{3,6} /.test(line)){let depth=line.match(/^#+/)[0].length;out.push('<h'+depth+'>'+inline(line.slice(depth+1),base)+'</h'+depth+'>');i++;continue}if(line.startsWith('```')){let code=[];i++;while(i<lines.length&&!lines[i].startsWith('```'))code.push(lines[i++]);i++;out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');continue}let para=[];while(i<lines.length&&lines[i].trim()&&!lines[i].startsWith('|')&&!/^[-*] |^\d+\. |^#{3,6} |^```/.test(lines[i]))para.push(lines[i++]);out.push('<p>'+para.map(x=>inline(x,base)).join('<br>')+'</p>')}return out.join('')}
async function getDoc(id){if(docs.has(id))return docs.get(id);let base=new URL('../references/style-book/'+id+'.md',location.href),res=await fetch(base);if(!res.ok)throw Error(id+' '+res.status);let raw=await res.text(),parts={};for(const match of raw.matchAll(/^## ([A-L])\. [^\n]+\n([\s\S]*?)(?=^## [A-L]\. |$(?![\s\S]))/gm))parts[match[1]]=match[2].trim();let data={raw,parts,base:base.href};docs.set(id,data);return data}
function counts(raw){return {unknown:(raw.match(/미확인/g)||[]).length,proposal:(raw.match(/제안/g)||[]).length,urls:new Set(raw.match(/https?:\/\/[^\s)|>]+/g)||[]).size}}
const overview=document.createElement('details');overview.className='panel';overview.style.margin='18px 0';overview.innerHTML='<summary style="cursor:pointer;font-weight:700;font-size:16px">전체 가이드 누락·검증 현황 보기</summary><div class="table-scroll" id="overviewTable"></div>';document.querySelector('#contract').before(overview);
const estimatesView=document.createElement('details');estimatesView.className='panel';estimatesView.style.margin='0 0 20px';estimatesView.innerHTML='<summary style="cursor:pointer;font-weight:700;font-size:16px">이 스타일의 임시 추정값 보기</summary><p class="muted">원본의 미확인 사실과 실제 시안에 쓰는 임시값을 분리합니다.</p><div class="table-scroll" id="estimateTable"></div>';document.querySelector('#contract').after(estimatesView);
Promise.all(names.map(x=>getDoc(x[0]))).then(list=>{let rows=names.map((name,i)=>{let d=list[i],eRows=(d.parts.E||'').split('\n').filter(line=>line.startsWith('|')&&!/^\|\s*:?-{2,}/.test(line)).length-1,c=counts(d.raw),status=d.parts.L?.includes('NOT_RUN')?'원본 대조 미완료':'L절 확인';return '<tr><td><button type="button" data-id="'+name[0]+'" style="border:0;background:none;color:#165a9d;cursor:pointer;text-align:left;padding:0;font:inherit">'+name[1]+'</button></td><td>'+Object.keys(d.parts).length+'/12</td><td>'+Math.max(eRows,0)+'</td><td>'+c.unknown+'</td><td>'+c.urls+'</td><td>'+status+'</td></tr>'});document.querySelector('#overviewTable').innerHTML='<table><thead><tr><th>스타일</th><th>A–L</th><th>E 표 행</th><th>미확인</th><th>출처 URL</th><th>검증</th></tr></thead><tbody>'+rows.join('')+'</tbody></table>';document.querySelectorAll('#overviewTable button').forEach(b=>b.onclick=()=>{current=b.dataset.id;history.replaceState(null,'','?style='+current);render();window.scrollTo({top:0,behavior:'smooth'})});nav()}).catch(e=>{document.querySelector('#overviewTable').textContent='전체 현황을 불러오지 못했습니다: '+e.message});
function nav(){let q=document.querySelector('#search').value.trim().toLowerCase();let html='';for(let group of ['플랫폼','실물','자유']){let subset=names.filter(x=>x[2]===group&&(!q||(x[1]+x[0]+(docs.get(x[0])?.raw||'')).toLowerCase().includes(q)));if(!subset.length)continue;html+='<div class="group-label">'+group+' · '+subset.length+'</div>'+subset.map(x=>'<button data-id="'+x[0]+'" aria-current="'+(current===x[0])+'">'+x[1]+'<small>'+x[0]+'</small></button>').join('')}document.querySelector('#nav').innerHTML=html;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{current=b.dataset.id;history.replaceState(null,'','?style='+current);render()})}
function panel(id,doc){let section=doc.parts[tab]||'이 절이 없습니다.',raw=section,samples=['E','G','L'].includes(tab)?'<div class="sample-links"><a href="style-book-component-board.html?style='+encodeURIComponent(id)+'">이 스타일의 컴포넌트 시연</a><a href="style-guess-books.html?style='+encodeURIComponent(id)+'#motion-demo">이 스타일의 모션 시연</a></div>':'';return '<section class="panel"><h3>'+names.find(x=>x[0]===id)[1]+' · '+tab+'. '+labels[tab]+'</h3>'+samples+'<div class="md">'+markdown(section,doc.base)+'</div><details class="source"><summary>이 절의 원문 보기</summary><pre>'+esc(raw)+'</pre></details></section>'}
const componentTargets={'앱바·탐색':'appbar','주·보조 버튼':'buttons','아이콘 버튼':'appbar','검색·텍스트 입력':'search','탭·필터 칩':'tabs','체크·라디오·스위치':'choices','슬라이더':'sliders','목록 행':'list','카드·정보 묶음':'card','진행·상태':'progress','대화상자':'feedback','바텀 시트':'feedback','토스트·빈/오류 상태':'states'};
const motionTargets={'주 행동 눌림':0,'선택 상태':1,'연속값 변화':2,'임시 면 진입':3,'화면 전환':4};
function decorateSamples(){document.querySelectorAll('#panels > .panel').forEach((panel,index)=>{const style=index===0?current:document.querySelector('#compare').value;panel.querySelectorAll('.md tbody tr').forEach(row=>{const cell=row.querySelector('td');if(!cell)return;const label=cell.textContent.trim();let href='';if(tab==='E'&&componentTargets[label])href='style-book-component-board.html?style='+encodeURIComponent(style)+'#component-'+componentTargets[label];if(tab==='G'){const name=Object.keys(motionTargets).find(key=>label.startsWith(key));if(name)href='style-guess-books.html?style='+encodeURIComponent(style)+'#motion-'+motionTargets[name]}if(href){const link=document.createElement('a');link.href=href;link.className='row-sample-link';link.textContent='시연 보기 ↗';link.setAttribute('aria-label',label+' 시연 보기');cell.append(' ',link)}})})}
async function render(){
  try{
    let [details,estimates,expressions,doc]=await Promise.all([detailPromise,estimatePromise,expressionPromise,getDoc(current)]);
    let pair=document.querySelector('#compare').value,other=pair?await getDoc(pair):null;
    let meta=names.find(x=>x[0]===current),c=counts(doc.raw),d=details[current],working=estimates.records.filter(x=>x.style===current);
    document.querySelector('#title').textContent=meta[1];
    document.querySelector('#intro').textContent=meta[2]+' 스타일 · 원본 미확인과 임시 구현값을 분리해 확인하세요.';
    let source=expressions.source_evidence[current];sourceNotice.textContent=source?'원본 관찰: '+source.ids+' — '+source.observed+' · 미측정: '+source.missing+' · E절의 형태·상태·모션 변환은 설계 가설입니다.':'플랫폼 원본값과 추정값은 B·E·K·L절에서 구분해 확인하세요.';
    document.querySelector('#preview').href='style-book-reference-screen.html?style='+encodeURIComponent(d.preview);
    boardLink.href='style-book-component-board.html?style='+encodeURIComponent(current);
    bookLink.href='style-guess-books.html?style='+encodeURIComponent(current);
    document.querySelector('#raw').href=doc.base;
    document.querySelector('#stats').innerHTML='<span class="stat">A–L '+Object.keys(doc.parts).length+'/12절</span><span class="stat">출처 URL '+c.urls+'개</span><span class="stat warn">원본 미확인 표기 '+c.unknown+'곳</span><span class="stat">임시 구현값 '+working.length+'개</span><span class="stat warn">원본 대조 '+(doc.parts.L?.includes('NOT_RUN')?'미완료':'기록 확인')+'</span>';
    document.querySelector('#contract').innerHTML=[['글꼴',d.font],['아이콘',d.icon],['재생·음량 슬라이더',d.scrub+' / '+d.volume]].map(x=>'<article><h3>'+x[0]+' · '+d.grade+'</h3><p>'+esc(x[1])+'</p></article>').join('');
    document.querySelector('#estimateTable').innerHTML='<table><thead><tr><th>부품</th><th>현재값</th><th>등급</th><th>근거·추론</th><th>검증</th></tr></thead><tbody>'+working.map(x=>'<tr><td>'+esc(x.label)+'</td><td>'+esc(x.value)+'</td><td>'+esc(x.grade)+' · '+esc(x.confidence)+'</td><td>'+esc(x.basis)+'<br>'+esc(x.method)+'</td><td>'+esc(x.qa)+'</td></tr>').join('')+'</tbody></table>';
    document.querySelector('#tabs').innerHTML=Object.keys(labels).map(k=>'<button role="tab" aria-selected="'+(tab===k)+'" data-tab="'+k+'" title="'+labels[k]+'">'+k+'</button>').join('');
    document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
    document.querySelector('#panels').className='panels'+(other?' compare':'');
    document.querySelector('#panels').innerHTML=panel(current,doc)+(other?panel(pair,other):'');
    decorateSamples();
    nav();
  }catch(e){document.querySelector('#panels').innerHTML='<p class="empty">가이드를 불러오지 못했습니다: '+esc(e.message)+'</p>'}
}
document.querySelector('#search').oninput=nav;let compare=document.querySelector('#compare');compare.innerHTML+=[...names].map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('');compare.onchange=render;render();
</script><script src="style-guidebook-table.js"></script></body></html>
